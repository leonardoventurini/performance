<template name="detail">
  {{#if Template.subscriptionsReady}}
    {{#with run}}
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
          <span class="badge bg-primary">{{tag}}</span>
          <a href="/scenario/{{scenario}}" class="text-decoration-none">{{scenario}}</a>
        </h2>
        <a href="/" class="btn btn-outline-secondary">Back</a>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Run Info</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>Date</td><td>{{formatDate timestamp}}</td></tr>
                <tr><td>Tag</td><td>{{tag}}</td></tr>
                <tr><td>Scenario</td><td>{{scenario}}</td></tr>
                <tr><td>Meteor version</td><td>{{meteor.version}}</td></tr>
                <tr><td>Meteor SHA</td><td><code>{{meteor.sha}}</code></td></tr>
                <tr><td>Wall clock</td><td>{{formatMs wall_clock_ms}}</td></tr>
                {{#if source}}<tr><td>Source</td><td>{{source}}</td></tr>{{/if}}
                {{#if prNumber}}<tr><td>PR</td><td>#{{prNumber}}</td></tr>{{/if}}
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-header">App Resources</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>CPU avg</td><td>{{appCpuAvg}}%</td></tr>
                <tr><td>CPU max</td><td>{{appCpuMax}}%</td></tr>
                <tr><td>RAM avg</td><td>{{appRamAvg}} MB</td></tr>
                <tr><td>RAM max</td><td>{{appRamMax}} MB</td></tr>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">DB Resources</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>CPU avg</td><td>{{dbCpuAvg}}%</td></tr>
                <tr><td>RAM avg</td><td>{{dbRamAvg}} MB</td></tr>
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Garbage Collection</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>GC count</td><td>{{gcCount}}</td></tr>
                <tr><td>Total pause</td><td>{{gcTotalPause}} ms</td></tr>
                <tr><td>Max pause</td><td>{{gcMaxPause}} ms</td></tr>
                <tr><td>Avg pause</td><td>{{gcAvgPause}} ms</td></tr>
                <tr><td>Minor (scavenge)</td><td>{{gcMinorCount}} ({{gcMinorMs}} ms)</td></tr>
                <tr><td>Major (full)</td><td>{{gcMajorCount}} ({{gcMajorMs}} ms)</td></tr>
              </table>
            </div>
          </div>
        </div>
      </div>

      {{#if hasDdpMethods}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                DDP Methods <span class="badge bg-secondary float-end">{{ddpMethodsTotal}} calls</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Method</th><th class="text-end">count</th><th class="text-end">avg</th><th class="text-end">p95</th><th class="text-end">p99</th><th class="text-end">max</th></tr>
                  </thead>
                  <tbody>
                    {{#each ddpMethodsRows}}
                      <tr><td><code>{{name}}</code></td><td class="text-end">{{count}}</td><td class="text-end">{{avg}}</td><td class="text-end">{{p95}}</td><td class="text-end">{{p99}}</td><td class="text-end">{{max}}</td></tr>
                    {{/each}}
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">latency in ms · server-side method handler wall time</div>
            </div>
          </div>

          {{#if hasDdpSubscriptions}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  DDP Subscriptions <span class="badge bg-secondary float-end">{{ddpSubsTotal}} subs</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Publication</th><th class="text-end">count</th><th class="text-end">avg</th><th class="text-end">p95</th><th class="text-end">p99</th><th class="text-end">max</th></tr>
                    </thead>
                    <tbody>
                      {{#each ddpSubsRows}}
                        <tr><td><code>{{name}}</code></td><td class="text-end">{{count}}</td><td class="text-end">{{avg}}</td><td class="text-end">{{p95}}</td><td class="text-end">{{p99}}</td><td class="text-end">{{max}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">latency in ms · sub-message arrival → ready dispatch</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{/if}}

      {{#if hasLiveUpdatePropagation}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                Live-update propagation <span class="badge bg-secondary float-end">{{lupObservedUpdates}} emits</span>
              </div>
              <div class="card-body">
                <table class="table table-sm mb-0">
                  <tr><td>avg</td><td class="text-end">{{lupAvg}} ms</td></tr>
                  <tr><td>p50</td><td class="text-end">{{lupP50}} ms</td></tr>
                  <tr><td>p95</td><td class="text-end">{{lupP95}} ms</td></tr>
                  <tr><td>p99</td><td class="text-end">{{lupP99}} ms</td></tr>
                  <tr><td>max</td><td class="text-end">{{lupMax}} ms</td></tr>
                </table>
              </div>
              <div class="card-footer text-muted small">insertAsync → sendAdded latency · attributable to observer driver choice</div>
            </div>
          </div>

          {{#if hasMongoOps}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo opcounters <span class="badge bg-secondary float-end">{{mongoOpsDuration}}s window</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Op</th><th class="text-end">total</th><th class="text-end">ops/sec</th></tr>
                    </thead>
                    <tbody>
                      {{#each mongoOpsRows}}
                        <tr><td><code>{{op}}</code></td><td class="text-end">{{total}}</td><td class="text-end">{{perSec}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">serverStatus delta over the run · workload shape</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{else}}
        {{#if hasMongoOps}}
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo opcounters <span class="badge bg-secondary float-end">{{mongoOpsDuration}}s window</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Op</th><th class="text-end">total</th><th class="text-end">ops/sec</th></tr>
                    </thead>
                    <tbody>
                      {{#each mongoOpsRows}}
                        <tr><td><code>{{op}}</code></td><td class="text-end">{{total}}</td><td class="text-end">{{perSec}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">serverStatus delta over the run · workload shape</div>
              </div>
            </div>
          </div>
        {{/if}}
      {{/if}}

      {{#if hasObserverPool}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                Observer pool <span class="badge bg-secondary float-end">{{observerPoolSamples}} samples @ {{observerPoolInterval}}ms</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Metric</th><th class="text-end">min</th><th class="text-end">max</th><th class="text-end">avg</th><th class="text-end">end</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>Multiplexers</td><td class="text-end">{{observerMuxMin}}</td><td class="text-end">{{observerMuxMax}}</td><td class="text-end">{{observerMuxAvg}}</td><td class="text-end">{{observerMuxEnd}}</td></tr>
                    <tr><td>Handles</td><td class="text-end">{{observerHandleMin}}</td><td class="text-end">{{observerHandleMax}}</td><td class="text-end">{{observerHandleAvg}}</td><td class="text-end">{{observerHandleEnd}}</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">multiplexer = unique cursor description · handle = a subscription on that cursor · end ≈ 0 means clean teardown</div>
            </div>
          </div>

          {{#if hasDdpMessages}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  DDP messages <span class="badge bg-secondary float-end">{{ddpMsgsDuration}}s · {{ddpMsgsTotalIn}} in / {{ddpMsgsTotalOut}} out</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th></th><th class="text-end">total</th><th class="text-end">per sec</th></tr>
                    </thead>
                    <tbody>
                      <tr><td>incoming (client → server)</td><td class="text-end">{{ddpMsgsTotalIn}}</td><td class="text-end">{{ddpMsgsInPerSec}}</td></tr>
                      <tr><td>outgoing (server → client)</td><td class="text-end">{{ddpMsgsTotalOut}}</td><td class="text-end">{{ddpMsgsOutPerSec}}</td></tr>
                    </tbody>
                  </table>
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Type</th><th class="text-end">in</th><th class="text-end">out</th></tr>
                    </thead>
                    <tbody>
                      {{#each ddpMsgsByTypeRows}}
                        <tr><td><code>{{type}}</code></td><td class="text-end">{{in}}</td><td class="text-end">{{out}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">message counts pre-compression · workload chattiness</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{else}}
        {{#if hasDdpMessages}}
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  DDP messages <span class="badge bg-secondary float-end">{{ddpMsgsDuration}}s · {{ddpMsgsTotalIn}} in / {{ddpMsgsTotalOut}} out</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th></th><th class="text-end">total</th><th class="text-end">per sec</th></tr>
                    </thead>
                    <tbody>
                      <tr><td>incoming (client → server)</td><td class="text-end">{{ddpMsgsTotalIn}}</td><td class="text-end">{{ddpMsgsInPerSec}}</td></tr>
                      <tr><td>outgoing (server → client)</td><td class="text-end">{{ddpMsgsTotalOut}}</td><td class="text-end">{{ddpMsgsOutPerSec}}</td></tr>
                    </tbody>
                  </table>
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Type</th><th class="text-end">in</th><th class="text-end">out</th></tr>
                    </thead>
                    <tbody>
                      {{#each ddpMsgsByTypeRows}}
                        <tr><td><code>{{type}}</code></td><td class="text-end">{{in}}</td><td class="text-end">{{out}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">message counts pre-compression · workload chattiness</div>
              </div>
            </div>
          </div>
        {{/if}}
      {{/if}}

      {{#if hasMongoPool}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                Mongo connection pool <span class="badge bg-secondary float-end">{{mongoPoolSamples}} samples @ {{mongoPoolInterval}}ms</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Metric</th><th class="text-end">min</th><th class="text-end">max</th><th class="text-end">avg</th><th class="text-end">end</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>Current</td><td class="text-end">{{mongoPoolCurrentMin}}</td><td class="text-end">{{mongoPoolCurrentMax}}</td><td class="text-end">{{mongoPoolCurrentAvg}}</td><td class="text-end">{{mongoPoolCurrentEnd}}</td></tr>
                    <tr><td>Active</td><td class="text-end">{{mongoPoolActiveMin}}</td><td class="text-end">{{mongoPoolActiveMax}}</td><td class="text-end">{{mongoPoolActiveAvg}}</td><td class="text-end">{{mongoPoolActiveEnd}}</td></tr>
                  </tbody>
                </table>
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Total created</th><th class="text-end">start</th><th class="text-end">end</th><th class="text-end">Δ</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>connections</td><td class="text-end">{{mongoPoolTotalStart}}</td><td class="text-end">{{mongoPoolTotalEnd}}</td><td class="text-end">+{{mongoPoolTotalDelta}}</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">current = open connections · active = ones doing work · saturation when current ≈ active</div>
            </div>
          </div>

          {{#if hasMongoSlowQueries}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo slow queries <span class="badge bg-secondary float-end">{{mongoSlowTotal}} slow · ≥{{mongoSlowThreshold}}ms</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Op type</th><th class="text-end">count</th></tr>
                    </thead>
                    <tbody>
                      {{#each mongoSlowByOpRows}}
                        <tr><td><code>{{op}}</code></td><td class="text-end">{{count}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                  {{#if hasMongoSlowSample}}
                    <table class="table table-sm mb-0">
                      <tbody>
                        <tr><td>slowest</td><td class="text-end"><code>{{mongoSlowSampleNs}}</code> · {{mongoSlowSampleOp}} · {{mongoSlowSampleMs}} ms</td></tr>
                        <tr><td>filter keys</td><td class="text-end"><code>{{mongoSlowSampleFilterKeys}}</code></td></tr>
                        <tr><td>plan</td><td class="text-end"><code>{{mongoSlowSamplePlan}}</code></td></tr>
                      </tbody>
                    </table>
                  {{/if}}
                </div>
                <div class="card-footer text-muted small">profile.system entries · filter values redacted, keys only</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{else}}
        {{#if hasMongoSlowQueries}}
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo slow queries <span class="badge bg-secondary float-end">{{mongoSlowTotal}} slow · ≥{{mongoSlowThreshold}}ms</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Op type</th><th class="text-end">count</th></tr>
                    </thead>
                    <tbody>
                      {{#each mongoSlowByOpRows}}
                        <tr><td><code>{{op}}</code></td><td class="text-end">{{count}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                  {{#if hasMongoSlowSample}}
                    <table class="table table-sm mb-0">
                      <tbody>
                        <tr><td>slowest</td><td class="text-end"><code>{{mongoSlowSampleNs}}</code> · {{mongoSlowSampleOp}} · {{mongoSlowSampleMs}} ms</td></tr>
                        <tr><td>filter keys</td><td class="text-end"><code>{{mongoSlowSampleFilterKeys}}</code></td></tr>
                        <tr><td>plan</td><td class="text-end"><code>{{mongoSlowSamplePlan}}</code></td></tr>
                      </tbody>
                    </table>
                  {{/if}}
                </div>
                <div class="card-footer text-muted small">profile.system entries · filter values redacted, keys only</div>
              </div>
            </div>
          </div>
        {{/if}}
      {{/if}}

      {{#if hasMongoIndexUsage}}
        {{#each mongoIndexCollections}}
          <div class="row mb-3">
            <div class="col-md-12">
              <div class="card">
                <div class="card-header">
                  Mongo index usage · <code>{{collection}}</code>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Index</th><th>Key</th><th class="text-end">ops in window</th><th class="text-end">tracked since</th></tr>
                    </thead>
                    <tbody>
                      {{#each indexes}}
                        <tr><td><code>{{name}}</code></td><td><code>{{keyJson}}</code></td><td class="text-end">{{ops_in_window}}</td><td class="text-end small">{{since}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">$indexStats delta over the run · ops_in_window=0 means dead-weight index (writes maintain it, no reads use it)</div>
              </div>
            </div>
          </div>
        {{/each}}
      {{/if}}

      {{#if hasDdpFrameSize}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">DDP frame size</div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Direction</th><th class="text-end">count</th><th class="text-end">avg</th><th class="text-end">p50</th><th class="text-end">p95</th><th class="text-end">p99</th><th class="text-end">max</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>in</td><td class="text-end">{{frameInCount}}</td><td class="text-end">{{frameInAvg}}</td><td class="text-end">{{frameInP50}}</td><td class="text-end">{{frameInP95}}</td><td class="text-end">{{frameInP99}}</td><td class="text-end">{{frameInMax}}</td></tr>
                    <tr><td>out</td><td class="text-end">{{frameOutCount}}</td><td class="text-end">{{frameOutAvg}}</td><td class="text-end">{{frameOutP50}}</td><td class="text-end">{{frameOutP95}}</td><td class="text-end">{{frameOutP99}}</td><td class="text-end">{{frameOutMax}}</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">bytes per DDP frame · JSON.stringify length · pre-compression</div>
            </div>
          </div>

          {{#if hasDdpCompression}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">DDP compression (coarse)</div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Direction</th><th class="text-end">uncompressed</th><th class="text-end">compressed</th><th class="text-end">ratio</th><th class="text-end">savings</th></tr>
                    </thead>
                    <tbody>
                      <tr><td>in</td><td class="text-end">{{compIn.uncompressed}}</td><td class="text-end">{{compIn.compressed}}</td><td class="text-end">{{compIn.ratio}}</td><td class="text-end">{{compIn.savings}}</td></tr>
                      <tr><td>out</td><td class="text-end">{{compOut.uncompressed}}</td><td class="text-end">{{compOut.compressed}}</td><td class="text-end">{{compOut.ratio}}</td><td class="text-end">{{compOut.savings}}</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">socket.bytesRead/Written vs pre-compression JSON · includes WS framing overhead (coarse)</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{/if}}

      {{#if hasMongoChangestream}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                Mongo change-stream cursors <span class="badge bg-secondary float-end">{{changestreamSamples}} samples @ {{changestreamInterval}}ms</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th></th><th class="text-end">min</th><th class="text-end">max</th><th class="text-end">avg</th><th class="text-end">end</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>total cursors</td><td class="text-end">{{changestreamCursorMin}}</td><td class="text-end">{{changestreamCursorMax}}</td><td class="text-end">{{changestreamCursorAvg}}</td><td class="text-end">{{changestreamCursorEnd}}</td></tr>
                  </tbody>
                </table>
                {{#if hasChangestreamNamespaces}}
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Namespace</th><th class="text-end">max</th><th class="text-end">avg</th></tr>
                    </thead>
                    <tbody>
                      {{#each changestreamNamespaces}}
                        <tr><td><code>{{ns}}</code></td><td class="text-end">{{max}}</td><td class="text-end">{{avg}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                {{/if}}
              </div>
              <div class="card-footer text-muted small">active currentOp getmores for $changeStream pipelines · 250ms sampling</div>
            </div>
          </div>

          {{#if hasMongoWiredtiger}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo WiredTiger cache <span class="badge bg-secondary float-end">hit ratio {{wtRatioPct}}</span>
                </div>
                <div class="card-body">
                  <table class="table table-sm mb-0">
                    <tr><td>cache hit ratio</td><td class="text-end">{{wtRatio}}</td></tr>
                    <tr><td>pages requested</td><td class="text-end">{{wtRequested}}</td></tr>
                    <tr><td>pages read into cache</td><td class="text-end">{{wtReadIn}}</td></tr>
                    <tr><td>pages written from cache</td><td class="text-end">{{wtWritten}}</td></tr>
                    <tr><td>bytes in cache (end)</td><td class="text-end">{{wtBytesInCache}}</td></tr>
                  </table>
                </div>
                <div class="card-footer text-muted small">WT cache traffic over the run · hit ratio above 0.95 is healthy on Meteor workloads</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{/if}}

      {{#if hasDriverFallbacks}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                Driver fallbacks <span class="badge bg-secondary float-end">{{driverConfiguredFirst}} configured</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <tr><td>total observe() calls</td><td class="text-end">{{driverTotal}}</td></tr>
                  <tr><td>no fallback</td><td class="text-end">{{driverNoFallback}}</td></tr>
                  <tr><td>fell back</td><td class="text-end">{{driverFallbackCount}}</td></tr>
                </table>
                {{#if hasDriverFallbackTransitions}}
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Transition</th><th class="text-end">cursors</th></tr>
                    </thead>
                    <tbody>
                      {{#each driverFallbackRows}}
                        <tr><td><code>{{transition}}</code></td><td class="text-end">{{count}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                {{/if}}
              </div>
              <div class="card-footer text-muted small">per-cursor driver actually selected vs first preference · silent fallback exposes mixed-workload runs</div>
            </div>
          </div>
        </div>
      {{/if}}

      {{#if hasBuildProfile}}
        <div class="row mb-3">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                Build profile (top hot nodes) <span class="badge bg-secondary float-end">total {{buildTotalMs}} ms</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Node</th><th class="text-end">self ms</th><th class="text-end">children ms</th><th class="text-end">count</th></tr>
                  </thead>
                  <tbody>
                    {{#each buildTopNodes}}
                      <tr><td><code>{{name}}</code></td><td class="text-end">{{self_ms}}</td><td class="text-end">{{children_ms}}</td><td class="text-end">{{count}}</td></tr>
                    {{/each}}
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">METEOR_PROFILE=1 hot nodes by self_ms · top {{buildTopNCount}} = {{buildTopNTotalMs}} ms · long tail = {{buildLongTailMs}} ms</div>
            </div>
          </div>
        </div>
      {{/if}}

      {{#if hasPluginCompile}}
        <div class="row mb-3">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                Per-compiler-plugin time <span class="badge bg-secondary float-end">{{pluginTotalMs}} ms across {{pluginCount}} plugins</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Plugin</th><th class="text-end">self ms</th><th class="text-end">count</th></tr>
                  </thead>
                  <tbody>
                    {{#each pluginRows}}
                      <tr><td><code>{{plugin}}</code></td><td class="text-end">{{self_ms}}</td><td class="text-end">{{count}}</td></tr>
                    {{/each}}
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">extracted from METEOR_PROFILE=1 same as build_profile · sorted by self_ms desc</div>
            </div>
          </div>
        </div>
      {{/if}}
    {{else}}
      <div class="alert alert-warning">Run not found.</div>
    {{/with}}
  {{else}}
    <div class="text-center my-5">
      <div class="spinner-border" role="status"></div>
    </div>
  {{/if}}
</template>
