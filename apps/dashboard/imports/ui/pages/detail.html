<template name="detail">
  {{#if Template.subscriptionsReady}}
    {{#with run}}
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
          <span class="badge bg-primary">{{tag}}</span>
          <a href="/scenario/{{scenario}}" class="text-decoration-none">{{scenario}}</a>
        </h2>
        <a href="/" class="btn btn-outline-secondary">Back</a>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Run Info</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>Date</td><td>{{formatDate timestamp}}</td></tr>
                <tr><td>Tag</td><td>{{tag}}</td></tr>
                <tr><td>Scenario</td><td>{{scenario}}</td></tr>
                <tr><td>Meteor version</td><td>{{meteor.version}}</td></tr>
                <tr><td>Meteor SHA</td><td><code>{{meteor.sha}}</code></td></tr>
                <tr><td>Wall clock</td><td>{{formatMs wall_clock_ms}}</td></tr>
                {{#if source}}<tr><td>Source</td><td>{{source}}</td></tr>{{/if}}
                {{#if prNumber}}<tr><td>PR</td><td>#{{prNumber}}</td></tr>{{/if}}
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-header">App Resources</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>CPU avg</td><td>{{appCpuAvg}}%</td></tr>
                <tr><td>CPU max</td><td>{{appCpuMax}}%</td></tr>
                <tr><td>RAM avg</td><td>{{appRamAvg}} MB</td></tr>
                <tr><td>RAM max</td><td>{{appRamMax}} MB</td></tr>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">DB Resources</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>CPU avg</td><td>{{dbCpuAvg}}%</td></tr>
                <tr><td>RAM avg</td><td>{{dbRamAvg}} MB</td></tr>
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Garbage Collection</div>
            <div class="card-body">
              <table class="table table-sm mb-0">
                <tr><td>GC count</td><td>{{gcCount}}</td></tr>
                <tr><td>Total pause</td><td>{{gcTotalPause}} ms</td></tr>
                <tr><td>Max pause</td><td>{{gcMaxPause}} ms</td></tr>
                <tr><td>Avg pause</td><td>{{gcAvgPause}} ms</td></tr>
                <tr><td>Minor (scavenge)</td><td>{{gcMinorCount}} ({{gcMinorMs}} ms)</td></tr>
                <tr><td>Major (full)</td><td>{{gcMajorCount}} ({{gcMajorMs}} ms)</td></tr>
              </table>
            </div>
          </div>
        </div>
      </div>

      {{#if hasDdpMethods}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                DDP Methods <span class="badge bg-secondary float-end">{{ddpMethodsTotal}} calls</span>
              </div>
              <div class="card-body p-0">
                <table class="table table-sm mb-0">
                  <thead>
                    <tr><th>Method</th><th class="text-end">count</th><th class="text-end">avg</th><th class="text-end">p95</th><th class="text-end">p99</th><th class="text-end">max</th></tr>
                  </thead>
                  <tbody>
                    {{#each ddpMethodsRows}}
                      <tr><td><code>{{name}}</code></td><td class="text-end">{{count}}</td><td class="text-end">{{avg}}</td><td class="text-end">{{p95}}</td><td class="text-end">{{p99}}</td><td class="text-end">{{max}}</td></tr>
                    {{/each}}
                  </tbody>
                </table>
              </div>
              <div class="card-footer text-muted small">latency in ms · server-side method handler wall time</div>
            </div>
          </div>

          {{#if hasDdpSubscriptions}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  DDP Subscriptions <span class="badge bg-secondary float-end">{{ddpSubsTotal}} subs</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Publication</th><th class="text-end">count</th><th class="text-end">avg</th><th class="text-end">p95</th><th class="text-end">p99</th><th class="text-end">max</th></tr>
                    </thead>
                    <tbody>
                      {{#each ddpSubsRows}}
                        <tr><td><code>{{name}}</code></td><td class="text-end">{{count}}</td><td class="text-end">{{avg}}</td><td class="text-end">{{p95}}</td><td class="text-end">{{p99}}</td><td class="text-end">{{max}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">latency in ms · sub-message arrival → ready dispatch</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{/if}}

      {{#if hasLiveUpdatePropagation}}
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                Live-update propagation <span class="badge bg-secondary float-end">{{lupObservedUpdates}} emits</span>
              </div>
              <div class="card-body">
                <table class="table table-sm mb-0">
                  <tr><td>avg</td><td class="text-end">{{lupAvg}} ms</td></tr>
                  <tr><td>p50</td><td class="text-end">{{lupP50}} ms</td></tr>
                  <tr><td>p95</td><td class="text-end">{{lupP95}} ms</td></tr>
                  <tr><td>p99</td><td class="text-end">{{lupP99}} ms</td></tr>
                  <tr><td>max</td><td class="text-end">{{lupMax}} ms</td></tr>
                </table>
              </div>
              <div class="card-footer text-muted small">insertAsync → sendAdded latency · attributable to observer driver choice</div>
            </div>
          </div>

          {{#if hasMongoOps}}
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo opcounters <span class="badge bg-secondary float-end">{{mongoOpsDuration}}s window</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Op</th><th class="text-end">total</th><th class="text-end">ops/sec</th></tr>
                    </thead>
                    <tbody>
                      {{#each mongoOpsRows}}
                        <tr><td><code>{{op}}</code></td><td class="text-end">{{total}}</td><td class="text-end">{{perSec}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">serverStatus delta over the run · workload shape</div>
              </div>
            </div>
          {{/if}}
        </div>
      {{else}}
        {{#if hasMongoOps}}
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  Mongo opcounters <span class="badge bg-secondary float-end">{{mongoOpsDuration}}s window</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-sm mb-0">
                    <thead>
                      <tr><th>Op</th><th class="text-end">total</th><th class="text-end">ops/sec</th></tr>
                    </thead>
                    <tbody>
                      {{#each mongoOpsRows}}
                        <tr><td><code>{{op}}</code></td><td class="text-end">{{total}}</td><td class="text-end">{{perSec}}</td></tr>
                      {{/each}}
                    </tbody>
                  </table>
                </div>
                <div class="card-footer text-muted small">serverStatus delta over the run · workload shape</div>
              </div>
            </div>
          </div>
        {{/if}}
      {{/if}}
    {{else}}
      <div class="alert alert-warning">Run not found.</div>
    {{/with}}
  {{else}}
    <div class="text-center my-5">
      <div class="spinner-border" role="status"></div>
    </div>
  {{/if}}
</template>
